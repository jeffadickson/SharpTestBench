name: Prepare or publish validated NuGet release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Build and Icarus tests run ID
        required: true
        type: string
      publish:
        description: Publish the verified bundle to nuget.org (requires configured trusted publisher)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.verify.outputs.revision }}
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Verify source CI run
        id: verify
        env:
          RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci verify-release-run
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verify.outputs.revision }}
      - name: Restore workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-tools
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: downloaded
      - name: Assemble exact validated packages
        env:
          REVISION: ${{ steps.verify.outputs.revision }}
        run: dotnet run --project ci-tools/tools/SharpTestBench.Tools -c Release -- ci release-bundle --artifacts downloaded --output release
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: release/
  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-24.04
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - name: Check out workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-tools
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: release
      - run: dotnet run --project ci-tools/tools/SharpTestBench.Tools -c Release -- release-preflight --bundle release
      - name: Obtain short-lived NuGet credential
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish immutable versions
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet run --project ci-tools/tools/SharpTestBench.Tools -c Release -- ci publish-packages --bundle release
