name: Dual runner parity (Icarus)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: dual-runner-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        fixture: [counter, dsp, cpu]
        seed: [1, 17]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus and native toolchain
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-deps parity
      - name: Prepare pinned development adapter
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-adapter --gnu
      - name: Build solution including standalone runner and validation probe
        run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - name: Check runner failure gates
        run: python -m unittest discover -s tests/Tooling -v
      - name: Compare independent runner executions
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- dual-runner-ci --fixture ${{ matrix.fixture }} --seed ${{ matrix.seed }}
      - name: Prove both runners reject an injected scoreboard fault
        if: matrix.fixture != 'counter'
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- dual-runner-ci --fixture ${{ matrix.fixture }} --seed ${{ matrix.seed }} --negative-control
      - name: Qualify manifest compiler and selection options
        if: matrix.fixture == 'counter' && matrix.seed == 1
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- runner-manifest-check
      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-runner-parity-${{ matrix.fixture }}-${{ matrix.seed }}
          path: |
            build/dual-${{ matrix.fixture }}-${{ matrix.seed }}/**
            build/dual-${{ matrix.fixture }}-${{ matrix.seed }}-negative/**
            build/native-build*.json
            build/manifest-check/**
