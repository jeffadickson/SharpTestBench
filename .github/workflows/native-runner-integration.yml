name: Native runner Icarus integration
on:
  push:
    branches: [feature/native-dotnet-consumer-runner]
    paths:
      - 'tools/SharpTestBench.Runner/**'
      - '.github/workflows/native-runner-integration.yml'
  pull_request:
    paths:
      - 'tools/SharpTestBench.Runner/**'
      - '.github/workflows/native-runner-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  icarus-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog gcc g++
      - name: Provision transitional native GPI adapters
        run: |
          python tools/prepare_upstream.py
          CC=gcc CXX=g++ python -m pip install ./build/upstream/cocotb-source pytest
      - name: Compile managed runner and isolated counter consumer
        run: |
          dotnet build tools/SharpTestBench.Runner/SharpTestBench.Runner.csproj -c Release --warnaserror
          dotnet build examples/Counter/Counter.csproj -c Release
      - name: Build native host using current provisioning path
        run: |
          python tools/run.py --sim icarus --assembly examples/Counter/bin/Release/net10.0/Counter.dll --source examples/Counter/counter.sv --top counter --entry-type 'Entry, Counter' --label baseline-counter
      - name: Generate adapter manifest from installed cocotb-derived bridge
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from cocotb_tools import config
          root = Path.cwd()
          gpi_entry = config.gpi_entry_point()
          library, symbol = gpi_entry.rsplit(',', 1)
          impl = subprocess.check_output([sys.executable, '-m', 'cocotb_tools.config', '--gpi-impl', 'icarus', 'vpi'], text=True).strip()
          payload = {
              'schemaVersion': 1, 'simulator': 'icarus', 'top': 'counter',
              'sources': ['examples/Counter/counter.sv'],
              'assembly': 'examples/Counter/bin/Release/net10.0/Counter.dll',
              'nativeHost': 'build/libsharptestbench_host.so',
              'icarusBootstrap': str(config.lib_entry('vpi', 'icarus')),
              'gpiLibrary': library, 'gpiEntryPoint': symbol, 'gpiImpl': impl,
              'dotnetRoot': os.environ.get('DOTNET_ROOT', '/usr/share/dotnet'),
              'outputDirectory': 'build/native-consumer', 'seed': 1, 'expectedTests': 1,
              'entryType': 'Entry, Counter'
          }
          (root/'native-consumer.json').write_text(json.dumps(payload, indent=2))
          PY
      - name: Verify counter through standalone .NET runner
        run: dotnet run --project tools/SharpTestBench.Runner -c Release --no-build -- run native-consumer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-runner-icarus-consumer
          path: |
            build/native-consumer/**
            build/baseline-counter-*.json
            build/baseline-counter-*.log
            native-consumer.json
