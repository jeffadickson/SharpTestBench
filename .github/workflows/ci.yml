name: Build and simulator tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-deps linux
      - name: Install pinned cocotb adapters
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-adapter --gnu
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- audit-reviews --source build/upstream/cocotb-source
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- array-reference --check
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- logic-reference --check
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python -m unittest discover -s tests/Tooling -v
      - run: dotnet run --project tests/SharpTestBench.Tools.Tests -c Release --no-build -- -xml build/helper-results.xml
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- managed-tests
      - run: dotnet run --project tests/SharpTestBench.Generators.Tests -c Release --no-build -- -xml build/generator-results.xml
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- run --sim icarus --log-json build/icarus-events.jsonl --waves build/icarus.vcd
      - name: Install pinned NVC for VHDL value callbacks
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-nvc
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- run --sim nvc --label nvc
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- native-build-check
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- queue-reference --label icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- queue-reference --label nvc
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- structured-reference-env --label icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- logging-check --label icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- coverage-check --label icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- timing-parity --sim icarus --label icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- wave-check --label icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- wave-tests
      - run: dotnet build examples/Counter -c Release
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- run --sim icarus --no-build --assembly examples/Counter/bin/Release/net10.0/Counter.dll --source examples/Counter/counter.sv --top counter --entry-type "Entry, Counter" --label counter --waves build/counter.vcd
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- cleanup-tests
      - run: dotnet build examples/AxiMemory -c Release -p:RestoreLockedMode=true
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- axi-workload --transactions 128 --repeat 3
        env:
          AXI_CLOCK_MODE: native
      - run: dotnet build examples/DspFir -c Release
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- dsp-workload --cycles 1024 --repeat 3
      - run: dotnet build examples/CpuCore -c Release
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- cpu-workload --iterations 256 --repeat 3
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- workspace-tests
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- native-package
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- stage-tests
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- typecheck
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- parity --label icarus
      - name: Validate managed debugger inside Icarus
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci debugger-check
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- native-debugger-tests
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- native-faults
        env:
          CS_DOTNET_ROOT: ${{ env.DOTNET_ROOT }}
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- icarus-layouts-check --ivl-root /usr/lib/x86_64-linux-gnu/ivl --include /usr/include/iverilog
        env:
          CS_DOTNET_ROOT: ${{ env.DOTNET_ROOT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: |
            build/*results.*
            build/native-build*.json
            build/native-vectorization.txt
            build/upstream/native-profile.json
            build/upstream/cocotb-source/build/**/CMakeCache.txt
            build/upstream/cocotb-source/build/**/compile_commands.json
            build/packages-*/*.nupkg
            build/package-evidence-*/**
            build/workspace-check/**
            build/icarus-layout-check/**
            build/axi-workload/**
            build/dsp-workload/**
            build/cpu-workload/**
            build/*structured.json
            build/structured-*.json
            build/structured-*.log
            build/structured-*.xml
            build/managed-injected-failure.xml
            build/*events.jsonl
            build/*artifacts.json
            build/*.vcd
            build/*python-order.*
            build/*run.log
            build/*trace.txt*
            build/typecheck.log
            build/native-faults.json
            build/debugger-check/**
            build/native-debugger-check/**

  verilator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: verilator-results
          - os: ubuntu-24.04-arm
            artifact: verilator-results-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-deps verilator
      - name: Build pinned Verilator 5.048
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-verilator
      - name: Install pinned native adapters
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-adapter --gnu
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python -m unittest discover -s tests/Tooling -v
      - run: dotnet run --project tests/SharpTestBench.Tools.Tests -c Release --no-build -- -xml build/helper-results.xml
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- run --sim verilator --label verilator --waves build/verilator.vcd
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- queue-reference --label verilator
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- wave-check --label verilator
      - name: Check benchmark values using the same compiled model
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- run --sim verilator --no-build --project Benchmark --sim-executable build/verilator/top --label verilator-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/verilator*results.*
            build/verilator*run.log
            build/verilator*trace.txt*
            build/verilator.vcd
            build/verilator/model-build.json
            build/native-build.json
            build/native-vectorization.txt

  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS simulator
        if: runner.os == 'macOS'
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-deps macos
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-iverilog
      - name: Select matching Windows simulator and target SDK
        if: runner.os == 'Windows'
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci windows-toolchain --root "${{ steps.msys2.outputs.msys2-location }}" --variant ucrt64
      - name: Install pinned native adapters
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-adapter
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- audit-reviews --source build/upstream/cocotb-source
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- array-reference --check
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- logic-reference --check
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python -m unittest discover -s tests/Tooling -v
      - run: dotnet run --project tests/SharpTestBench.Tools.Tests -c Release --no-build -- -xml build/helper-results.xml
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- managed-tests
      - run: dotnet run --project tests/SharpTestBench.Generators.Tests -c Release --no-build -- -xml build/generator-results.xml
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- run --sim icarus --label platform-icarus --waves build/platform-icarus.vcd
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- native-build-check
      - name: Check macOS elaboration metadata (native ARM64)
        if: runner.os == 'macOS'
        env:
          CS_DOTNET_ROOT: ${{ env.DOTNET_ROOT }}
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci layouts
      - name: Check Windows elaboration metadata
        if: runner.os == 'Windows'
        env:
          CS_DOTNET_ROOT: ${{ env.DOTNET_ROOT }}
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci layouts
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- queue-reference --label platform-icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- structured-reference-env --label platform-icarus
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- wave-check --label platform-icarus
      - run: dotnet build examples/Counter -c Release
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- run --sim icarus --no-build --assembly examples/Counter/bin/Release/net10.0/Counter.dll --source examples/Counter/counter.sv --top counter --entry-type "Entry, Counter" --label counter --waves build/counter.vcd
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- cleanup-tests
      - run: dotnet build examples/AxiMemory -c Release -p:RestoreLockedMode=true
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- axi-workload --transactions 128 --repeat 3
        env:
          AXI_CLOCK_MODE: native
      - run: dotnet build examples/DspFir -c Release
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- dsp-workload --cycles 1024 --repeat 3
      - run: dotnet build examples/CpuCore -c Release
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- cpu-workload --iterations 256 --repeat 3
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- workspace-tests
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- native-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-results-${{ matrix.os }}
          path: |
            windows-toolchain.txt
            build/*results.*
            build/native-build*.json
            build/native-vectorization.txt
            build/upstream/native-profile.json
            build/upstream/cocotb-source/build/**/CMakeCache.txt
            build/upstream/cocotb-source/build/**/compile_commands.json
            build/packages-*/*.nupkg
            build/package-evidence-*/**
            build/workspace-check/**
            build/icarus-layout-check/**
            build/axi-workload/**
            build/dsp-workload/**
            build/cpu-workload/**
            build/*structured.json
            build/structured-*.json
            build/structured-*.log
            build/structured-*.xml
            build/*run.log
            build/*driver.log
            build/*.vcd

  installed-linux-container:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-results
          path: downloaded
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- package-container --artifacts downloaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-linux-container-evidence
          path: build/container-evidence/

  release-bundle:
    needs: [linux, native-platforms, installed-linux-container, verilator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Validate release candidates from all native consumers
        env:
          REVISION: ${{ github.sha }}
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci release-bundle --artifacts downloaded --output release
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release/
