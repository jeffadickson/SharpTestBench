name: Build and Icarus tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog gcc g++
      - name: Install pinned cocotb adapters
        run: |
          python tools/prepare_upstream.py
          CC=gcc CXX=g++ python -m pip install ./build/upstream/cocotb-source pytest
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python tools/managed_tests.py
      - run: python tools/run.py --sim icarus --log-json build/icarus-events.jsonl --waves build/icarus.vcd
      - run: python tools/structured_reference_env.py --label icarus
      - run: python tools/logging_check.py --label icarus
      - run: python tools/coverage_check.py --label icarus
      - run: python tools/timing_parity.py --sim icarus --label icarus
      - run: python tools/wave_check.py --label icarus
      - run: python tools/wave_tests.py
      - run: dotnet build examples/Counter -c Release
      - run: python tools/run.py --sim icarus --no-build --assembly examples/Counter/bin/Release/net10.0/Counter.dll --source examples/Counter/counter.sv --top counter --entry-type "Entry, Counter" --label counter --waves build/counter.vcd
      - run: python tools/cleanup_tests.py
      - run: python tools/stage_tests.py
      - run: python tools/typecheck.py
      - run: python tools/parity.py --label icarus
      - run: python tools/native_faults.py
        env:
          CS_DOTNET_ROOT: ${{ env.DOTNET_ROOT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: |
            build/*results.*
            build/*structured.json
            build/structured-*.json
            build/structured-*.log
            build/structured-*.xml
            build/managed-injected-failure.xml
            build/*events.jsonl
            build/*artifacts.json
            build/*.vcd
            build/*python-order.*
            build/*run.log
            build/*trace.txt*
            build/typecheck.log
            build/native-faults.json

  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS simulator
        if: runner.os == 'macOS'
        run: brew install icarus-verilog
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install Windows simulator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install iverilog --yes --no-progress
          'C:\iverilog\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pinned native adapters
        run: |
          python tools/prepare_upstream.py
          python -m pip install ./build/upstream/cocotb-source pytest
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python tools/managed_tests.py
      - run: python tools/run.py --sim icarus --label platform-icarus --waves build/platform-icarus.vcd
      - run: python tools/structured_reference_env.py --label platform-icarus
      - run: python tools/wave_check.py --label platform-icarus
      - run: dotnet build examples/Counter -c Release
      - run: python tools/run.py --sim icarus --no-build --assembly examples/Counter/bin/Release/net10.0/Counter.dll --source examples/Counter/counter.sv --top counter --entry-type "Entry, Counter" --label counter --waves build/counter.vcd
      - run: python tools/cleanup_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-results-${{ matrix.os }}
          path: |
            build/*results.*
            build/*structured.json
            build/structured-*.json
            build/structured-*.log
            build/structured-*.xml
            build/*run.log
            build/*driver.log
            build/*.vcd
