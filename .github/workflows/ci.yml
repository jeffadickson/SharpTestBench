name: Build and Icarus tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog gcc g++ gdb
      - name: Install pinned cocotb adapters
        run: |
          python tools/prepare_upstream.py
          CC=gcc CXX=g++ python -m pip install ./build/upstream/cocotb-source pytest
      - run: python -m unittest discover -s tests/Tooling -v
      - run: python tools/audit_reviews.py --source build/upstream/cocotb-source
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python tools/managed_tests.py
      - run: dotnet run --project tests/SharpTestBench.Generators.Tests -c Release --no-build -- -xml build/generator-results.xml
      - run: python tools/run.py --sim icarus --log-json build/icarus-events.jsonl --waves build/icarus.vcd
      - name: Install pinned NVC for VHDL value callbacks
        run: |
          curl --fail --location --retry 3 https://github.com/nickg/nvc/releases/download/r1.23.0/nvc_1.23.0-1_amd64_ubuntu-24.04.deb -o build/nvc.deb
          echo '33d65eafb83d83352716895e44c116002f94d8a198a9486a3cee6df3e4fdfb89  build/nvc.deb' | sha256sum --check
          sudo apt-get install -y ./build/nvc.deb
      - run: python tools/run.py --sim nvc --label nvc
      - run: python tools/queue_reference.py --label icarus
      - run: python tools/queue_reference.py --label nvc
      - run: python tools/structured_reference_env.py --label icarus
      - run: python tools/logging_check.py --label icarus
      - run: python tools/coverage_check.py --label icarus
      - run: python tools/timing_parity.py --sim icarus --label icarus
      - run: python tools/wave_check.py --label icarus
      - run: python tools/wave_tests.py
      - run: dotnet build examples/Counter -c Release
      - run: python tools/run.py --sim icarus --no-build --assembly examples/Counter/bin/Release/net10.0/Counter.dll --source examples/Counter/counter.sv --top counter --entry-type "Entry, Counter" --label counter --waves build/counter.vcd
      - run: python tools/cleanup_tests.py
      - run: dotnet build examples/AxiMemory -c Release -p:RestoreLockedMode=true
      - run: python tools/axi_workload.py --transactions 128 --repeat 3
      - run: python tools/workspace_tests.py
      - run: python tools/native_package.py
      - run: python tools/stage_tests.py
      - run: python tools/typecheck.py
      - run: python tools/parity.py --label icarus
      - name: Validate managed debugger inside Icarus
        run: |
          curl --fail --location --retry 3 https://github.com/Samsung/netcoredbg/releases/download/3.2.0-1092/netcoredbg-linux-amd64.tar.gz -o build/netcoredbg.tar.gz
          echo '080eb3b2d2152465f599d3b33d1ee6e747794e11cc0a3773ec689f5e5f2c5afa  build/netcoredbg.tar.gz' | sha256sum --check
          mkdir -p build/debugger
          tar -xzf build/netcoredbg.tar.gz -C build/debugger
          dotnet build tests/DebugIntegration -c Debug
          python tools/debugger_tests.py --debugger build/debugger/netcoredbg/netcoredbg
      - run: python tools/native_debugger_tests.py
      - run: python tools/native_faults.py
        env:
          CS_DOTNET_ROOT: ${{ env.DOTNET_ROOT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: |
            build/*results.*
            build/packages-*/*.nupkg
            build/package-evidence-*/**
            build/workspace-check/**
            build/axi-workload/**
            build/*structured.json
            build/structured-*.json
            build/structured-*.log
            build/structured-*.xml
            build/managed-injected-failure.xml
            build/*events.jsonl
            build/*artifacts.json
            build/*.vcd
            build/*python-order.*
            build/*run.log
            build/*trace.txt*
            build/typecheck.log
            build/native-faults.json
            build/debugger-check/**
            build/native-debugger-check/**

  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS simulator
        if: runner.os == 'macOS'
        run: brew install icarus-verilog
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install Windows simulator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install iverilog --yes --no-progress
          'C:\iverilog\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pinned native adapters
        run: |
          python tools/prepare_upstream.py
          python -m pip install ./build/upstream/cocotb-source pytest
      - run: python -m unittest discover -s tests/Tooling -v
      - run: python tools/audit_reviews.py --source build/upstream/cocotb-source
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python tools/managed_tests.py
      - run: dotnet run --project tests/SharpTestBench.Generators.Tests -c Release --no-build -- -xml build/generator-results.xml
      - run: python tools/run.py --sim icarus --label platform-icarus --waves build/platform-icarus.vcd
      - run: python tools/queue_reference.py --label platform-icarus
      - run: python tools/structured_reference_env.py --label platform-icarus
      - run: python tools/wave_check.py --label platform-icarus
      - run: dotnet build examples/Counter -c Release
      - run: python tools/run.py --sim icarus --no-build --assembly examples/Counter/bin/Release/net10.0/Counter.dll --source examples/Counter/counter.sv --top counter --entry-type "Entry, Counter" --label counter --waves build/counter.vcd
      - run: python tools/cleanup_tests.py
      - run: dotnet build examples/AxiMemory -c Release -p:RestoreLockedMode=true
      - run: python tools/axi_workload.py --transactions 128 --repeat 3
      - run: python tools/workspace_tests.py
      - run: python tools/native_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-results-${{ matrix.os }}
          path: |
            build/*results.*
            build/packages-*/*.nupkg
            build/package-evidence-*/**
            build/workspace-check/**
            build/axi-workload/**
            build/*structured.json
            build/structured-*.json
            build/structured-*.log
            build/structured-*.xml
            build/*run.log
            build/*driver.log
            build/*.vcd

  installed-linux-container:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-results
          path: downloaded
      - run: python tools/package_container.py --artifacts downloaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-linux-container-evidence
          path: build/container-evidence/

  release-bundle:
    needs: [linux, native-platforms, installed-linux-container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Validate release candidates from all native consumers
        env:
          REVISION: ${{ github.sha }}
        run: python tools/release_bundle.py --artifacts downloaded --output release --revision "$REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release/
