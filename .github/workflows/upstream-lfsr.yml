name: Upstream LFSR CRC parity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lfsr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [crc32, crc16, crc32c, crc64, crc64xz, prbs7, scrambler, descrambler, galois_ff, minimal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-deps parity
      - name: Install pinned adapters
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci install-adapter --gnu
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python -m unittest discover -s tests/Tooling -q
      - name: Check both implementation styles and corruption channels
        run: dotnet run --project tools/SharpTestBench.Tools -c Release -- ci lfsr-matrix --fixture ${{ matrix.fixture }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfsr-${{ matrix.fixture }}
          path: build/lfsr-*/
