name: Upstream LFSR CRC parity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lfsr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [crc32, crc16, crc32c, prbs7, scrambler, descrambler, galois_ff, minimal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog gcc g++
      - name: Install pinned adapters
        run: |
          python tools/prepare_upstream.py
          CC=gcc CXX=g++ python -m pip install ./build/upstream/cocotb-source pytest
      - run: dotnet build SharpTestBench.slnx -c Release -p:RestoreLockedMode=true
      - run: python -m unittest discover -s tests/Tooling -q
      - name: Check both implementation styles and corruption channels
        run: |
          for style in LOOP REDUCTION; do
            for seed in 1 17; do
              python tools/lfsr_ci.py --fixture ${{ matrix.fixture }} --style "$style" --seed "$seed"
            done
            for fault in 1 2; do
              python tools/lfsr_ci.py --fixture ${{ matrix.fixture }} --style "$style" --seed 1 --fault "$fault"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lfsr-${{ matrix.fixture }}
          path: build/lfsr-*/
